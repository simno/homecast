version: '3.8'

services:
  homecast:
    # Use pre-built image from GitHub Container Registry
    # Or uncomment 'build: .' to build locally
    image: ghcr.io/simno/homecast:latest
    # build: .
    container_name: homecast
    network_mode: host  # Required for mDNS device discovery
    restart: unless-stopped
    volumes:
      # AirPlay pairing credentials; without this, Apple TVs must be
      # re-paired every time the container is re-created (e.g. on upgrade)
      - homecast-data:/app/data
    # Optional: a GPU lets HomeCast convert 4K H.264 streams (X/Periscope
    # broadcasts) to HEVC, which 4K Chromecasts can play (amd64 images).
    #
    # Intel (Arc, Quick Sync iGPUs) or AMD: pass the GPU through, and set
    # group_add to the group that owns its render node on the host:
    # stat -c %g /dev/dri/renderD128
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "992"
    #
    # NVIDIA: install the NVIDIA Container Toolkit on the host, then:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu, video, utility]  # video: NVENC; utility: GPU load
    environment:
      - NODE_ENV=production
      - PORT=3000  # Change this to use a different port
      # Stale device timeout in hours (default: 3)
      # Devices not seen for this duration will be removed from the list
      # Increase if your devices send infrequent mDNS updates (e.g., some LG TVs)
      - STALE_DEVICE_TIMEOUT_HOURS=3
      # Optional: Persistent CSRF secret (auto-generated each restart if not set)
      # Set this to a random string to keep CSRF tokens valid across restarts
      # - CSRF_SECRET=your-random-secret-here
      # Optional: Set your machine's LAN IP if auto-detection fails
      # - HOST_IP=192.168.1.100
      # Optional: 4K conversion for Chromecast (needs a GPU passed through above).
      # With several Intel/AMD GPUs, name the render node to use (e.g. the Arc, not the iGPU)
      # - TRANSCODE_DEVICE=/dev/dri/renderD129
      # Converted video gets 4x the source's bitrate (re-encoding needs more
      # bits than the original to keep its quality), up to this ceiling
      # - TRANSCODE_BITRATE=25M
      # Simultaneous encodes (default 1: most GPUs have one video engine)
      # - TRANSCODE_CONCURRENCY=1
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:' + (process.env.PORT || 3000) + '/api/devices', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  homecast-data:
