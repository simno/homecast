name: Site check

# The site resolvers (Twitch, X, SpaceX, Kick, Dailymotion, Rumble, NASA+,
# YouTube through yt-dlp) against the real sites, weekly: their
# APIs change without notice. A failure opens an issue (or comments on the
# open one) so it's seen before users hit it.
on:
  schedule:
    - cron: '17 6 * * 1'  # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sites:
    name: Resolve live sites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The latest, as the Docker images take it; [default] brings the
      # challenge scripts yt-dlp runs in Node for YouTube.
      - name: Install yt-dlp
        run: pip install --user "yt-dlp[default]"

      - name: Run site checks
        run: npm run test:sites 2>&1 | tee sites.log

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Site check failing"
          body=$(printf 'The weekly site check failed: %s\n\n```\n%s\n```\n' "$RUN_URL" "$(grep -E '✖|AssertionError|Error:' sites.log | head -30)")
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
