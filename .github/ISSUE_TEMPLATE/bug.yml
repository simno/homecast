name: Something else is broken
description: A bug in the dashboard, the server or the Docker image.
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Server log
      render: text
  - type: input
    id: version
    attributes:
      label: HomeCast version
      placeholder: "0.9.11"
