name: A site doesn't work
description: HomeCast found no video on a page, or found one that won't play.
labels: [site]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a site. DRM-protected services (Netflix, Disney+ and similar), YouTube and MJPEG
        webcams can't be supported. See [Supported sources](https://github.com/simno/homecast#supported-sources).
  - type: input
    id: url
    attributes:
      label: Page URL
      description: The page you pasted into HomeCast. If it's private, describe the kind of site instead.
      placeholder: https://example.com/live
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: What happened
      options:
        - Analyze found no video
        - Analyze found a video, but casting failed
        - It started playing, then stopped or stalled
        - Something else
    validations:
      required: true
  - type: dropdown
    id: receiver
    attributes:
      label: Receiver
      options:
        - Chromecast or a TV with Cast built in
        - Apple TV (AirPlay)
        - LG webOS TV
        - Didn't get that far
    validations:
      required: true
  - type: dropdown
    id: image
    attributes:
      label: Image
      description: The `lite` image can't find streams that only appear once the page's JavaScript runs.
      options:
        - latest (full)
        - lite
        - Built from source
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Server log
      description: The lines from pressing Analyze to the failure (`docker logs homecast`).
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: HomeCast version
      placeholder: "0.9.11"
